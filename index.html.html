<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#122544"><title>Сложный звонок — интерактивный тренажёр</title><style>
:root{--bg:#f4f7fb;--paper:#fff;--navy:#142a4e;--navy2:#203c69;--red:#ac2848;--ink:#142540;--muted:#66768e;--line:#e0e7f0;--green:#167858;--orange:#bd7218;--shadow:0 22px 55px rgba(30,49,89,.10)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#edf4ff,transparent 34%),var(--bg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #6d9ff4;outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:28px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:35px}.brand{font-weight:900;letter-spacing:.08em;color:var(--navy);font-size:13px}.dot{display:inline-block;width:12px;height:12px;background:var(--red);border-radius:50%;margin-right:9px}.chip{font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:50px;background:white;color:var(--muted)}.shell{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.hero{background:linear-gradient(120deg,#142a4e,#264875);color:#fff;padding:42px 45px;position:relative}.hero:after{content:"◉";position:absolute;font-size:240px;right:30px;top:-80px;opacity:.06;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:#bbcee9}h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:15px 0 14px;letter-spacing:-.035em}h2{font-size:clamp(23px,3vw,30px);line-height:1.2;margin:0 0 12px}h3{font-size:17px;margin:0 0 6px}.hero p{max-width:650px;color:#d6e3f5;font-size:17px}.panel{padding:30px 42px}.muted{color:var(--muted)}.btn{background:var(--red);color:#fff;border:0;border-radius:13px;padding:13px 22px;font-weight:800;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px);background:#8e1e3b}.btn.alt{background:var(--navy)}.btn.ghost{background:#eff3f9;color:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}.stack{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:24px 0}.tile{border:1px solid var(--line);border-radius:16px;padding:17px;background:#fbfcff}.tile strong{display:block;font-size:23px;color:var(--navy)}.tile span{font-size:13px;color:var(--muted)}.scenarioGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:19px}.scenario{border:1px solid var(--line);background:#fff;text-align:left;border-radius:16px;padding:18px;transition:border-color .15s,transform .15s}.scenario:hover{border-color:#90a7c8;transform:translateY(-2px)}.scenario .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#edf1f8;color:var(--navy);font-weight:800;margin-bottom:9px}.scenario h3{font-size:16px}.scenario p{font-size:13px;color:var(--muted);margin:0}.scenario.done{border-color:#a2d5c1}.progress{height:9px;background:#e8edf6;border-radius:50px;overflow:hidden;margin:11px 0 22px}.progress>div{height:100%;background:linear-gradient(90deg,#bf3855,#284c7f);border-radius:inherit;transition:width .25s}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.call{background:#f4f7fb;border:1px solid var(--line);border-radius:18px;padding:22px 23px;margin:18px 0 20px}.speaker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--red);margin-bottom:8px}.quote{font-size:clamp(19px,2.6vw,25px);line-height:1.45;font-weight:700;color:var(--navy)}.ask{font-weight:800;margin:16px 0 10px}.options{display:grid;gap:11px}.option{width:100%;background:white;border:2px solid var(--line);border-radius:14px;text-align:left;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;color:var(--ink);transition:border .15s,background .15s}.option:hover:not(:disabled){border-color:#9bb1d3;background:#f8faff}.letter{display:inline-flex;justify-content:center;align-items:center;flex:none;background:#eff3f9;border-radius:9px;font-weight:800;width:31px;height:31px}.option:disabled{cursor:default}.option.selected{border-color:#3b639c;background:#f2f6fc}.option.best{border-color:#71bca4}.feedback{margin:20px 0 0;border-left:5px solid var(--navy);background:#f4f7fc;padding:19px 21px;border-radius:0 14px 14px 0}.feedback.good{border-color:var(--green);background:#effaf6}.feedback.warn{border-color:var(--orange);background:#fff9ef}.feedback.bad{border-color:var(--red);background:#fff4f6}.feedback strong{display:block;margin-bottom:6px}.response{margin-top:12px;padding:12px 15px;background:white;border-radius:11px;border:1px solid var(--line);font-size:15px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:21px;flex-wrap:wrap}.score{font-size:clamp(38px,6vw,70px);line-height:1;font-weight:900;letter-spacing:-.05em;color:var(--navy);margin:14px 0}.result{background:#f3f7fd;border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}.result p{margin:5px 0}.tag{font-size:12px;font-weight:800;color:var(--red);letter-spacing:.08em;text-transform:uppercase}.hide{display:none!important}.note{font-size:13px;color:var(--muted)}.kicker{display:inline-block;background:#fff1f4;color:#a32142;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}.review{padding:14px 0;border-bottom:1px solid var(--line)}.review:last-child{border:0}label{font-weight:700;display:block;margin-bottom:7px}input[type=text]{font:inherit;border:1px solid #cbd5e5;padding:11px 14px;border-radius:12px;width:min(100%,420px);margin-bottom:14px}footer{font-size:12px;color:var(--muted);margin-top:24px;text-align:center}@media(max-width:650px){.wrap{padding:18px 12px 40px}.hero{padding:31px 23px}.panel{padding:23px 19px}.tiles,.scenarioGrid{grid-template-columns:1fr}.tiles{gap:8px}.tile{padding:12px}.top{margin-bottom:20px}.quote{font-size:19px}.call{padding:17px}}
@media print{.top,.foot,.btn,.scenarioGrid,footer{display:none!important}body{background:white}.wrap{padding:0}.shell{box-shadow:none;border:0}.panel{padding:10px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="dot"></span>АКАДЕМИЯ КОНТАКТ-ЦЕНТРА</div><span class="chip">Практика реальных диалогов</span></header><section id="app" aria-live="polite"></section><footer>Учебный симулятор. Реплики являются примерами коммуникации, а не заменой утверждённого скрипта, регламентов и правил фиксации обращений.</footer></main><script>
const cases=[
{id:'calls',title:'«Сколько можно звонить?!»',desc:'Раздражение из-за повторных звонков',skill:'Деэскалация и уважение границ',steps:[
{q:'«Вы мне уже сто раз звонили! Отстаньте от меня наконец!»',opts:[['«Не кричите, пожалуйста. Я ничего плохого не сделал».',0,'Клиент слышит спор и усиливает претензию.','«Так ещё и учить меня будете?!»','Вы защищаетесь вместо того, чтобы отреагировать на причину раздражения.'],['«Понимаю ваше раздражение из-за звонков. Извините за неудобство. Уточню, как прекратить нежелательные обращения».',3,'Напряжение снижается: клиент видит, что его услышали.','«Вот именно, я не хочу, чтобы мне больше звонили».','Вы признаёте эмоцию и обозначаете конкретное действие — дальше следуйте процедуре банка.'],['«Это займёт всего минуту, выслушайте предложение».',1,'Клиент воспринимает ответ как игнорирование просьбы.','«Я же сказал: ничего не нужно!»','Нельзя продолжать продажу, игнорируя явное нежелание общаться.']]},
{q:'«Мне неинтересно, и вообще удалите мой номер!»',opts:[['«Может, всё-таки узнаете об условиях?»',0,'Раздражение растёт.','«Вы вообще слышите, что вам говорят?»','Продолжение презентации нарушает границу клиента.'],['«Я услышал вашу просьбу. Зафиксирую обращение в соответствии с установленным порядком».',3,'Клиент перестаёт спорить.','«Хорошо. Только чтобы действительно больше не звонили».','Не обещайте невозможного: корректно оформите запрос по регламенту.'],['«Тогда просто положите трубку».',0,'Клиент остаётся с ощущением неуважения.','«Буду жаловаться!»','Не перекладывайте обработку запроса на клиента.']]},
{q:'«И что теперь будет?»',opts:[['«Больше никто никогда не позвонит, гарантирую».',0,'Обещание может оказаться недостоверным.','«Посмотрим. Я записал ваш ответ».','Не давайте абсолютных гарантий вне своих полномочий.'],['«Проверю и зафиксирую результат обращения согласно правилам банка. Благодарю, что сообщили».',3,'Разговор завершается спокойнее.','«Хорошо, спасибо».','Прозрачность действий важнее попытки удержать клиента в разговоре.'],['«Не знаю, это не ко мне».',1,'Доверие снижается.','«А кто тогда этим занимается?»','Лучше объяснить доступный следующий шаг.']]}]},
{id:'rude',title:'Грубость и личные выпады',desc:'Клиент оскорбляет оператора',skill:'Спокойный тон и профессиональные границы',steps:[
{q:'«Вы там вообще ничего не соображаете?! Сколько можно объяснять!»',opts:[['«Давайте без оскорблений. Вы сами непонятно говорите».',0,'Спор становится личным.','«Позовите нормального сотрудника!»','Ответная агрессия усиливает конфликт.'],['«Вижу, что ситуация вас сильно раздражает. Давайте уточним, что именно осталось нерешённым».',3,'Клиент возвращается к сути проблемы.','«Мне не объяснили, что с моей заявкой».','Отделение эмоции от задачи помогает продолжить разговор.'],['«Хорошо, я сейчас молча вас послушаю».',1,'Клиент не получает направления разговора.','«Ну так решите мой вопрос!»','Выслушать важно, но нужно и вести клиента к решению.']]},
{q:'«Я уже двадцать минут трачу! Вы что-нибудь можете?»',opts:[['«Могу помочь разобраться. Уточню данные и проверю доступную информацию о заявке».',3,'Клиент соглашается на конкретный следующий шаг.','«Проверяйте».','Предлагайте только действия, доступные по вашей роли и после нужной идентификации.'],['«Я не виноват, что вы долго ждёте».',0,'Конфликт усиливается.','«Мне всё равно, кто виноват!»','Поиск виноватых не решает задачу.'],['«Не нервничайте».',1,'Клиент чувствует, что его эмоции обесценили.','«Не указывайте мне!»','Просьбы успокоиться часто воспринимаются как давление.']]},
{q:'«Вы обещаете решить вопрос сегодня?»',opts:[['«Да, сто процентов».',0,'Клиент получает необоснованное обещание.','«Я это запомнил».','Не обещайте сроков или решений, которые не контролируете.'],['«Я могу проверить статус и объяснить предусмотренные дальнейшие шаги. Срок назову, только если он подтверждён».',3,'Клиент понимает, чего ожидать.','«Хорошо, расскажите».','Честное ожидание уменьшает повторный негатив.'],['«Возможно, как повезёт».',1,'Ответ выглядит непрофессионально.','«Очень содержательно».','Неопределённость лучше объяснять предметно.']]}]},
{id:'price',title:'«У конкурентов выгоднее»',desc:'Возражение о ценности предложения',skill:'Уточнение потребности без давления',steps:[
{q:'«Я пользуюсь другим банком. У вас всё равно хуже условия».',opts:[['«У нас точно лучше, вы просто не знаете».',0,'Клиент защищает свой выбор.','«Откуда вы знаете мои условия?»','Не спорьте и не сравнивайте предложения без фактов.'],['«Понимаю. А что для вас важнее при выборе: стоимость, удобство или конкретные условия?»',3,'Клиент раскрывает критерий.','«Мне главное — чтобы не было лишних расходов».','Сначала выясните критерии, затем говорите о релевантной выгоде.'],['«Тогда всего доброго».',1,'Диалог заканчивается без понимания потребности.','«До свидания».','Не каждое сравнение означает окончательный отказ, но давление тоже не нужно.']]},
{q:'«Мне важно не переплачивать. Я не верю рекламным обещаниям».',opts:[['«Вы зря не верите, у нас всё честно».',1,'Недоверие остаётся.','«Так все говорят».','Общие заверения менее убедительны, чем проверяемые факты.'],['«Это разумный вопрос. Могу объяснить применимые условия и ограничения без рекламных формулировок».',3,'Клиент готов выслушать факты.','«Тогда расскажите конкретно».','Говорите по актуальным утверждённым условиям, не придумывайте выгоды.'],['«Главное — оформить, потом разберётесь».',0,'Клиент прекращает обсуждение.','«Нет, спасибо!»','Скрывать ограничения или торопить клиента нельзя.']]},
{q:'«А если мне всё равно не подходит?»',opts:[['«Тогда вы многое теряете».',0,'Ощущение давления усиливается.','«Не уговаривайте».','Страх упущенной выгоды не заменяет честную консультацию.'],['«Это ваш выбор. Я могу ответить на вопросы, а решение остаётся за вами».',3,'Клиент ощущает уважение к выбору.','«Хорошо, уточню один момент».','Свобода решения поддерживает доверие.'],['«Вы обязаны хотя бы попробовать».',0,'Клиент отказывается.','«Ничего я не обязан».','Не используйте принуждение.']]}]},
{id:'time',title:'«Мне некогда»',desc:'Клиент занят и хочет завершить звонок',skill:'Краткость и уважение времени',steps:[
{q:'«Я на работе, у меня вообще нет времени на ваши разговоры».',opts:[['«Но я уже начал рассказывать».',0,'Клиент раздражён.','«И что? До свидания».','Не спорьте с ограничением по времени.'],['«Понимаю, не буду задерживать. Подскажите, можно ли связаться в другое удобное время?»',3,'Клиент получает возможность выбрать.','«Может быть, вечером».','Договаривайтесь о контакте только если это допускается регламентом.'],['«Мне нужна только одна минута».',1,'Клиент сомневается.','«Вы все так говорите».','Обещание минуты редко снимает возражение.']]},
{q:'«Вечером тоже могу быть занят».',opts:[['«Тогда я всё равно перезвоню завтра».',0,'Клиент недоволен навязанным контактом.','«Нет, не звоните!»','Не назначайте время в одностороннем порядке.'],['«Понимаю. Если сейчас неудобно определиться, я завершу звонок. Спасибо за ответ».',3,'Клиент благодарит за краткость.','«Спасибо».','Не превращайте уточнение в давление.'],['«Ну назовите хоть какое-то время».',1,'Клиент чувствует давление.','«Не знаю».','Повторное требование после отказа ухудшает контакт.']]},
{q:'«И больше ничего сейчас не нужно?»',opts:[['«Нет, благодарю за уделённое время. Хорошего дня».',3,'Разговор спокойно заканчивается.','«До свидания».','Краткое уважительное завершение сохраняет впечатление.'],['«Вообще-то я ещё должен вам всё рассказать».',0,'Клиент прерывает звонок.','«Я занят!»','Нельзя возвращать презентацию без согласия.'],['«Нет. Пока».',1,'Разговор завершён резко.','«Понятно».','Даже короткое завершение может быть вежливым.']]}]},
{id:'complaint',title:'«Мне уже не помогли»',desc:'Повторное обращение и жалоба',skill:'Активное слушание и конкретные шаги',steps:[
{q:'«Я уже звонил вчера. Ваш коллега обещал разобраться, и ничего!»',opts:[['«Я за коллег не отвечаю».',0,'Клиенту приходится повторять претензию.','«У вас никто ни за что не отвечает!»','Не переводите проблему на другого сотрудника.'],['«Сожалею, что вопрос остался открытым. Уточню ситуацию и проверю историю обращения, если она мне доступна».',3,'Клиент готов предоставить сведения.','«Ладно. Посмотрите, пожалуйста».','Признание неудобства и проверяемое действие лучше оправданий.'],['«Может, вы просто не так поняли».',0,'Клиент возмущён.','«То есть это я виноват?»','Не обвиняйте клиента без оснований.']]},
{q:'«Вы снова заставите меня всё рассказывать?»',opts:[['«Да, у нас так принято».',1,'Клиент раздражён дополнительными действиями.','«Это издевательство».','Объясняйте необходимость вопросов и минимизируйте повторы.'],['«Сначала посмотрю доступную историю. Уточню только то, чего не хватает для проверки».',3,'Клиент соглашается.','«Так уже лучше».','Экономьте время клиента и соблюдайте требования идентификации.'],['«Не хотите — не надо».',0,'Клиент воспринимает это как отказ помочь.','«Тогда пишу жалобу».','Нельзя ставить ультиматум.']]},
{q:'«Если и теперь ничего не решите, что мне делать?»',opts:[['«Надеюсь, такого не будет».',1,'Клиент не понимает следующие шаги.','«Надеяться я и сам умею».','Нужна понятная последовательность действий.'],['«Объясню доступный порядок дальнейшего обращения или эскалации по действующим правилам».',3,'Клиент получает маршрут решения.','«Хорошо, объясните».','Не обещайте исход, но дайте понятную навигацию.'],['«Больше не звоните, я не знаю».',0,'Недоверие увеличивается.','«Это безобразие».','Не оставляйте клиента без возможного следующего шага.']]}]},
{id:'refusal',title:'«Мне ничего не нужно»',desc:'Категоричный отказ от предложения',skill:'Работа с отказом без навязчивости',steps:[
{q:'«Нет, спасибо, мне ничего не нужно».',opts:[['«Вы даже не выслушали, это ошибка».',0,'Клиент ощущает давление.','«Я всё сказал».','Не обесценивайте выбор.'],['«Понял вас. Если позволите, один вопрос: предложение сейчас неактуально в принципе или именно его условия?»',3,'Клиент уточняет причину, если готов говорить.','«Мне пока просто не требуется ничего нового».','Один ненавязчивый вопрос допустим, если клиент не потребовал завершить контакт.'],['«Хорошо, но вы потом пожалеете».',0,'Отказ становится жёстче.','«До свидания!»','Манипуляции ухудшают доверие.']]},
{q:'«Нет потребности. И покупать ничего не собираюсь».',opts:[['«Тогда не буду настаивать. Благодарю за ответ».',3,'Клиент завершает разговор спокойно.','«Спасибо, до свидания».','Отказ — допустимый итог диалога.'],['«Потребность появится, когда расскажу».',0,'Клиент прерывает звонок.','«Хватит продавать!»','Не пытайтесь создать ложную потребность.'],['«Вы обязаны объяснить причину отказа».',0,'Клиент возмущается.','«Ничего я не обязан».','Нельзя требовать обоснования отказа.']]},
{q:'«Точно всё?»',opts:[['«Да, благодарю за разговор. Всего доброго».',3,'Разговор заканчивается уважительно.','«И вам».','Сохраняйте вежливость до завершения.'],['«А можно я ещё расскажу про другое?»',0,'Клиент вновь раздражён.','«Нет!»','Не пытайтесь продать другой продукт после явного отказа.'],['«Да».',2,'Разговор завершён нейтрально.','«До свидания».','Вежливая прощальная реплика звучит профессиональнее.']]}]},
{id:'stress',title:'После тяжёлого звонка',desc:'Как восстановиться перед следующим клиентом',skill:'Эмоциональная устойчивость',steps:[
{q:'Клиент нагрубил, прервал разговор. Вы замечаете учащённое дыхание и напряжение.',opts:[['«Следующему клиенту покажу, как надо разговаривать».',0,'Негатив переносится в новый контакт.','Следующий клиент слышит раздражённый тон.','Не переносите реакцию на других людей.'],['«Сделаю короткую паузу по возможностям рабочего процесса, выровняю дыхание и вернусь к задачам».',3,'Напряжение постепенно снижается.','Вы ощущаете больший контроль над собой.','Краткая саморегуляция помогает избежать накопления стресса.'],['«Буду весь день прокручивать этот разговор».',0,'Напряжение закрепляется.','Сложнее сосредоточиться на следующем звонке.','Мысленное повторение конфликта без выводов не помогает.']]},
{q:'Вы думаете: «Наверное, я плохой оператор». Что делать?',opts:[['«Один звонок не определяет мою компетентность. Разберу, что мог контролировать, а что — нет».',3,'Самооценка становится реалистичнее.','Появляется конкретная точка роста.','Разделяйте поведение клиента и собственные навыки.'],['«Наверное, со мной всегда будут так общаться».',0,'Негативное обобщение усиливает стресс.','Становится сложнее работать.','Один эпизод не доказывает закономерность.'],['«Надо доказать всем, что клиент неправ».',1,'Внимание застревает на конфликте.','Вы продолжаете сердиться.','Лучше фокусироваться на полезном разборе.']]},
{q:'Непростые звонки повторяются. Как действовать системно?',opts:[['«Молчать, чтобы никто не подумал, что мне сложно».',0,'Нагрузка остаётся без поддержки.','Напряжение нарастает.','Обращаться за поддержкой — профессионально.'],['«Разбирать сложные кейсы с наставником, отрабатывать фразы и обращаться за поддержкой при необходимости».',3,'Навык и уверенность постепенно растут.','Вместе с наставником вы находите рабочие формулировки.','Тренировка и обратная связь уменьшают неопределённость.'],['«Всегда немедленно завершать любой неприятный разговор».',1,'Часть ситуаций остаётся неотработанной.','Разговоры прерываются преждевременно.','Действуйте по правилам безопасности и регламентам, а не избегайте любого дискомфорта.']]}]}

let state={screen:'home',selected:[],current:0,step:0,choice:null,points:0,total:0,history:[],name:''};const app=document.getElementById('app');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){if(state.screen==='home')home();if(state.screen==='call')call();if(state.screen==='between')between();if(state.screen==='end')end();}
function home(){app.innerHTML=`<article class="shell"><div class="hero"><span class="eyebrow">Интерактивный тренажёр • для новичков</span><h1>СЛОЖНЫЙ<br>ЗВОНОК</h1><p>Клиент раздражён, сомневается или резко отказывает. Что ты скажешь дальше? От твоего решения зависит, как продолжится разговор.</p><button class="btn" onclick="startAll()">Начать тренировку →</button></div><div class="panel"><span class="kicker">Обучение через выбор</span><div class="tiles"><div class="tile"><strong>7</strong><span>реалистичных ситуаций</span></div><div class="tile"><strong>21</strong><span>решение в диалогах</span></div><div class="tile"><strong>~15 мин</strong><span>на полное прохождение</span></div></div><h2>Выбери ситуацию</h2><p class="muted">Можно пройти весь маршрут или потренировать отдельный навык. После каждого ответа — реакция клиента и комментарий наставника.</p><div class="scenarioGrid">${cases.map((c,i)=>`<button class="scenario" onclick="startOne(${i})"><span class="num">${i+1}</span><h3>${escape(c.title)}</h3><p>${escape(c.desc)}</p></button>`).join('')}</div><p class="note">Условия продуктов и порядок действий необходимо сверять с актуальными материалами банка. Тренажёр не собирает и не передаёт персональные данные.</p></div></article>`}
function startAll(){state={screen:'call',selected:cases.map((_,i)=>i),current:0,step:0,choice:null,points:0,total:0,history:[],name:''};render();window.scrollTo(0,0)}function startOne(i){state={screen:'call',selected:[i],current:0,step:0,choice:null,points:0,total:0,history:[],name:''};render();window.scrollTo(0,0)}
function call(){const ci=state.selected[state.current],c=cases[ci],s=c.steps[state.step],previous=state.step>0?state.history[state.history.length-1]:null,isChosen=state.choice!==null,choice=isChosen?s.opts[state.choice]:null,progress=((state.current*3+state.step+(isChosen?1:0))/(state.selected.length*3))*100;app.innerHTML=`<article class="shell"><div class="panel"><div class="meta"><strong>Ситуация ${state.current+1} из ${state.selected.length}: ${escape(c.title)}</strong><span>Решение ${state.step+1} из 3 · ${state.points} баллов</span></div><div class="progress" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${progress}%"></div></div><span class="tag">Навык: ${escape(c.skill)}</span><div class="call"><div class="speaker">☎ Клиент ${state.step===0?'начинает разговор':'продолжает диалог'}</div><div class="quote">${previous?`<div style="font-size:15px;font-weight:500;color:#607390;margin-bottom:12px">Реакция на твой предыдущий ответ: «${escape(previous.reaction.replace(/^«|»$/g,''))}»</div>`:''}«${escape(s.q.replace(/^«|»$/g,''))}»</div></div><div class="ask">Как ответишь клиенту?</div><div class="options">${s.opts.map((o,i)=>`<button class="option ${isChosen&&i===state.choice?'selected':''} ${isChosen&&o[1]===3?'best':''}" ${isChosen?'disabled':''} onclick="choose(${i})"><span class="letter">${'АБВ'[i]}</span><span>${escape(o[0])}</span></button>`).join('')}</div>${isChosen?`<div class="feedback ${choice[1]===3?'good':choice[1]===0?'bad':'warn'}"><strong>${choice[1]===3?'✓ Удачное решение · +3 балла':choice[1]===2?'◉ Допустимый ответ · +2 балла':choice[1]===1?'△ Есть риск · +1 балл':'✕ Неудачный ответ · 0 баллов'}</strong><div>${escape(choice[4])}</div><div class="response"><b>Что происходит дальше:</b> ${escape(choice[2])}<br><b>Реакция клиента:</b> «${escape(choice[3].replace(/^«|»$/g,''))}»</div></div>`:''}<div class="foot"><button class="btn ghost" onclick="renderHomeConfirm()">← Главная</button>${isChosen?`<button class="btn" onclick="next()">${state.step===2?'Завершить ситуацию':'Следующий этап'} →</button>`:'<span class="note">Выбери один вариант для продолжения</span>'}</div></div></article>`;}
function choose(i){if(state.choice!==null)return;const c=cases[state.selected[state.current]],o=c.steps[state.step].opts[i];state.choice=i;state.points+=o[1];state.total+=3;state.history.push({scenario:c.title,step:state.step+1,score:o[1],answer:o[0],note:o[4],reaction:o[3]});render()}
function next(){if(state.choice===null)return;state.choice=null;if(state.step<2){state.step++;state.screen='call'}else if(state.current<state.selected.length-1){state.screen='between'}else{state.screen='end'}render();window.scrollTo(0,0)}function between(){const c=cases[state.selected[state.current]],r=state.history.slice(-3).reduce((a,b)=>a+b.score,0);app.innerHTML=`<article class="shell"><div class="hero"><span class="eyebrow">Ситуация завершена</span><h1>${r}/9 баллов</h1><p>${escape(c.title)}</p></div><div class="panel"><h2>${r>=8?'Ты отлично удерживаешь профессиональный тон':r>=5?'Хорошая основа — есть что улучшить':'Нужна дополнительная практика'}</h2><p class="muted">В следующих диалогах обращай внимание на признание эмоции, понятное действие и уважение к выбору клиента.</p><button class="btn" onclick="nextCase()">К следующему звонку →</button></div></article>`}function nextCase(){state.current++;state.step=0;state.choice=null;state.screen='call';render();window.scrollTo(0,0)}function renderHomeConfirm(){if(state.history.length&&!confirm('Вернуться на главную? Текущий результат не сохранится.'))return;state.screen='home';render()}
function end(){const pct=Math.round(state.points/state.total*100),label=pct>=85?'Уверенное управление диалогом':pct>=65?'Хороший результат, продолжай практику':'Рекомендуется повторная тренировка',weak=state.history.filter(x=>x.score<3),strong=state.history.filter(x=>x.score===3);app.innerHTML=`<article class="shell"><div class="hero"><span class="eyebrow">Итоги тренировки</span><h1>Звонок завершён</h1><p>${escape(label)}</p></div><div class="panel"><span class="tag">Твой результат</span><div class="score">${state.points}<span style="font-size:.42em;color:#72839e"> / ${state.total}</span></div><p class="muted">${pct}% максимального результата. Это учебная оценка решений, а не показатель эффективности реальной работы.</p><div class="result"><h3>Что получилось</h3><p>${strong.length?`Удачных решений: <b>${strong.length}</b>. Ты выбирал(а) действия, которые помогают снизить напряжение, уважать клиента и не давать лишних обещаний.`:'В этом прохождении пока нет решений с максимальными баллами — это повод потренироваться ещё.'}</p></div><div class="result"><h3>На что обратить внимание</h3><p>${weak.length?`Решений с рисками: <b>${weak.length}</b>. Просмотри разбор ниже и повтори ситуации, которые вызвали затруднения.`:'Во всех ситуациях ты выбрал(а) максимально подходящие варианты. Отличная основа для работы в линии!'}</p></div><h2>Разбор решений</h2>${state.history.map(h=>`<div class="review"><strong>${escape(h.scenario)} · этап ${h.step} · ${h.score}/3</strong><div class="muted">Твой ответ: ${escape(h.answer)}</div><div>${escape(h.note)}</div></div>`).join('')}<div class="foot"><button class="btn" onclick="startAll()">Пройти заново</button><button class="btn alt" onclick="window.print()">Распечатать итог</button><button class="btn ghost" onclick="copyReport()">Скопировать результат</button><button class="btn ghost" onclick="renderHomeConfirm()">Все ситуации</button></div><p class="note">Если результат нужен наставнику, скопируй текст или сохрани страницу в PDF через печать. Сайт не отправляет результаты на сервер автоматически.</p></div></article>`}
function copyReport(){const t=`Сложный звонок — результат тренировки\nБаллы: ${state.points}/${state.total}\n\n${state.history.map(h=>`${h.scenario}, этап ${h.step}: ${h.score}/3\nОтвет: ${h.answer}\nКомментарий: ${h.note}`).join('\n\n')}`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert('Результат скопирован')).catch(()=>prompt('Скопируйте текст:',t))}else prompt('Скопируйте текст:',t)}render();
</script></body></html>
