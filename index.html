<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2242">
  <title>Сложный звонок — тренажёр по негативу и возражениям</title>
  <style>
    :root{
      --bg:#071120;--bg2:#0d1d37;--paper:#ffffff;--paper2:#f7f9fc;--ink:#10223f;--muted:#667892;
      --line:#dce4f0;--brand:#b3284b;--brand2:#d14a6a;--navy:#11284f;--navy2:#214372;
      --good:#15835d;--warn:#c9861a;--bad:#c23a53;--cyan:#4aa6db;--shadow:0 30px 80px rgba(9,24,48,.18);
      --radius:26px;--radius2:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font:16px/1.56 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(90,145,255,.16), transparent 24%),
        radial-gradient(circle at 88% 0%, rgba(209,74,106,.20), transparent 20%),
        linear-gradient(180deg,var(--bg),var(--bg2) 32%, #eef3f9 32%, #eff3f9 100%);
    }
    button{font:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #7db4ff;outline-offset:3px}
    .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 70px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;color:#eaf1ff}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;font-size:13px}
    .logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#89233f);box-shadow:0 14px 30px rgba(179,40,75,.35)}
    .navchips{display:flex;gap:10px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);color:#d8e4ff;font-size:13px}
    .shell{background:var(--paper);border-radius:32px;box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(255,255,255,.5)}
    .hero{position:relative;background:linear-gradient(135deg,#0e2243 0%, #19355f 58%, #234878 100%);padding:48px 46px;color:#fff;overflow:hidden}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .hero:before{width:360px;height:360px;right:-110px;top:-130px;background:radial-gradient(circle, rgba(255,255,255,.18), transparent 60%)}
    .hero:after{width:300px;height:300px;left:-120px;bottom:-120px;background:radial-gradient(circle, rgba(209,74,106,.28), transparent 65%)}
    .eyebrow{display:inline-flex;gap:10px;align-items:center;color:#b9c9e6;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:800}
    .eyebrow b{display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),#f392a6)}
    h1{font-size:clamp(34px,5.7vw,66px);line-height:1.03;letter-spacing:-.045em;margin:16px 0 16px;max-width:780px}
    h2{font-size:clamp(24px,3.2vw,34px);line-height:1.14;letter-spacing:-.03em;margin:0 0 14px;color:var(--navy)}
    h3{font-size:18px;line-height:1.25;margin:0 0 8px}
    p{margin:0 0 12px}
    .hero p{max-width:700px;color:#d6e2f7;font-size:17px}
    .heroActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
    .btn{border:0;border-radius:15px;padding:14px 20px;font-weight:800;transition:transform .18s ease, filter .18s ease, background .18s ease}
    .btn:hover{transform:translateY(-1px);filter:saturate(1.04)}
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 18px 35px rgba(179,40,75,.28)}
    .btn.dark{background:#10233f;color:#fff}
    .btn.light{background:#eef3fa;color:var(--navy)}
    .btn.white{background:#fff;color:#10233f}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .panel{padding:34px 42px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:-28px;position:relative;z-index:2}
    .stat{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid #edf1f7;border-radius:20px;padding:18px 18px 16px;box-shadow:0 12px 32px rgba(16,34,63,.08)}
    .stat .num{font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-.04em}
    .stat .lab{font-size:13px;color:var(--muted)}
    .subgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:26px}
    .card{background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:22px}
    .card.dark{background:linear-gradient(135deg,#132848,#1a3962);color:#fff;border-color:transparent}
    .card.dark h3,.card.dark .muted{color:#fff}
    .muted{color:var(--muted)}
    .routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
    .route,.scenario{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff;text-align:left;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
    .route:hover,.scenario:hover{transform:translateY(-2px);border-color:#adc0df;box-shadow:0 12px 30px rgba(16,34,63,.07)}
    .routeHead,.scenarioHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#7e2440;background:#fff1f5}
    .badge{display:inline-block;padding:5px 8px;border-radius:10px;font-size:12px;font-weight:800;background:#eef3fb;color:#28466f}
    .scenarioGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
    .scenarioTitle{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
    .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
    .kpi{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:999px}
    .metaRow{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .progressOuter{height:10px;background:#e5ecf6;border-radius:999px;overflow:hidden}
    .progressInner{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),#6e8fd8);transition:width .25s ease}
    .sessionStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 22px}
    .sessionBox{border:1px solid var(--line);background:#fbfdff;border-radius:18px;padding:14px}
    .sessionBox .name{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7385a0;font-weight:800}
    .sessionBox strong{display:block;font-size:24px;color:var(--navy);margin-top:4px}
    .callWrap{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
    .bubble{border:1px solid var(--line);background:#f8fbff;border-radius:24px;padding:24px}
    .speaker{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--brand);margin-bottom:10px}
    .quote{font-size:clamp(20px,2.6vw,28px);line-height:1.42;font-weight:800;color:var(--navy)}
    .help{margin-top:16px;padding:14px 15px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14px}
    .coach{border:1px solid var(--line);border-radius:24px;background:#fff;padding:22px}
    .meter{margin:6px 0 18px}
    .meter .track{height:12px;background:#e8edf5;border-radius:999px;overflow:hidden}
    .meter .fill{height:100%;width:0;background:linear-gradient(90deg,#d94a69,#3482a8);border-radius:inherit;transition:width .25s ease}
    .meterLab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
    .ask{font-weight:900;font-size:18px;margin:12px 0 10px;color:var(--navy)}
    .options{display:grid;gap:11px;margin-top:12px}
    .option{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:16px 17px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);transition:border-color .15s ease, background .15s ease, transform .15s ease}
    .option:hover:not(:disabled){border-color:#98add2;background:#fbfdff;transform:translateY(-1px)}
    .option.selected{border-color:#355a8f;background:#f2f6fc}
    .option.best{border-color:#88c5ad;background:#f2fbf7}
    .letter{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#eef3fa;color:#183663;font-weight:900;flex:none}
    .feedback{margin-top:18px;border-radius:18px;padding:18px;border:1px solid var(--line);background:#f7fbff}
    .feedback.good{background:#effaf4;border-color:#bfe5d0}.feedback.warn{background:#fff9ef;border-color:#edd7a0}.feedback.bad{background:#fff4f6;border-color:#efc1cb}
    .feedback strong{display:block;margin-bottom:8px}
    .feedback .response,.feedback .rsv{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
    .feedback .rsv .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#8a2642;margin-bottom:6px}
    .controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
    .midCard{padding:32px 36px}.scoreBig{font-size:clamp(56px,7vw,92px);line-height:1;font-weight:900;color:var(--navy);letter-spacing:-.06em}
    .reviewItem{padding:16px 0;border-bottom:1px solid var(--line)}.reviewItem:last-child{border-bottom:0}
    .reviewItem .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
    .tagSkill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#edf3fb;color:#2c4e79}
    .recommend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
    .smallList{margin:0;padding-left:18px}.smallList li{margin:6px 0}
    .resultGrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px;margin-top:22px}
    .note{font-size:13px;color:var(--muted)}
    footer{color:#6d7e98;font-size:12px;text-align:center;padding:24px 0 0}
    .hide{display:none!important}
    @media(max-width:980px){.stats,.sessionStats,.routes,.recommend,.resultGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.subgrid,.callWrap{grid-template-columns:1fr}.scenarioGrid{grid-template-columns:1fr}}
    @media(max-width:680px){.wrap{padding:14px 10px 40px}.hero{padding:32px 22px}.panel,.midCard{padding:22px 18px}.stats,.sessionStats,.routes,.recommend,.resultGrid{grid-template-columns:1fr}.chip{font-size:12px}.quote{font-size:20px}.route,.scenario,.card{padding:16px}}
    @media print{body{background:#fff}.topbar,.heroActions,.controls,.routes,.scenarioGrid,.btn,footer{display:none!important}.wrap{padding:0}.shell{box-shadow:none;border:none}.panel,.midCard{padding:0 0 12px}.card{break-inside:avoid}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand"><span class="logo">☎</span> АКАДЕМИЯ КОНТАКТ-ЦЕНТРА</div>
      <div class="navchips">
        <span class="chip">Интерактивный тренажёр</span>
        <span class="chip">Негатив · Возражения · РСВ</span>
      </div>
    </header>
    <section id="app" aria-live="polite"></section>
    <footer>Учебный тренажёр для практики коммуникации. Используй его вместе с актуальными регламентами, РСВ, статьями и правилами банка.</footer>
  </main>
<script>
const scenarios = [
  {
    id:'calls', route:'core', title:'Сколько можно звонить?!', level:'База', tag:'Негатив',
    short:'Клиент раздражён повторными звонками и просит прекратить обращения.',
    skill:'Деэскалация и фиксация обращения', regulation:'много звонков / не звоните больше',
    coach:'Ключ: признать раздражение, извиниться за неудобство, не спорить и корректно зафиксировать просьбу клиента.',
    steps:[
      {q:'«Вы мне уже сто раз звонили! Отстаньте от меня наконец!»', meter:'high', opts:[
        ['«Не кричите, пожалуйста. Я ничего плохого не сделал».',0,'Клиент воспринимает ответ как защиту и спор.','«Так вы ещё и спорить со мной будете?!»','Ответ переводит диалог в личный конфликт. Сначала нужно признать эмоцию клиента.','В РСВ по блоку «много звонков» опора идёт на признание неудобства и корректное продолжение, а не на спор.'],
        ['«Понимаю ваше раздражение из-за частых звонков. Приношу извинения за неудобство. Давайте отмечу ваш запрос корректно».',3,'Напряжение снижается: клиент слышит, что его просьбу приняли всерьёз.','«Вот именно, я не хочу больше таких звонков».','Это сильный ход: вы признаёте эмоцию и обозначаете действие в рамках процедуры.','РСВ: «Понимаю, поступает много звонков, это не всегда приятно…» При просьбе отключить звонки — корректно отметить информацию и сообщить о сроке обработки.'],
        ['«Это займёт всего минуту, выслушайте предложение».',1,'Клиент чувствует, что его не услышали.','«Я же сказал: ничего не нужно!»','Продавливать продажу после явного раздражения рискованно.','Даже если хотите вернуть разговор к предложению, сначала нужно снять напряжение и понять, есть ли право продолжать диалог.']
      ]},
      {q:'«Мне неинтересно, и вообще удалите мой номер!»', meter:'mid', opts:[
        ['«Может, всё-таки расскажу, какие условия сейчас доступны?»',0,'Раздражение растёт, доверие падает.','«Вы вообще слышите, что вам говорят?»','Продолжение презентации после чёткого отказа только усиливает негатив.','В такой точке задача оператора — корректно обработать отказ, а не давить.'],
        ['«Я услышал вашу просьбу. Зафиксирую информацию в соответствии с установленным порядком. Приношу извинения за беспокойство».',3,'Клиент успокаивается, потому что видит понятный следующий шаг.','«Хорошо. Главное, чтобы это действительно сработало».','Вы остаетесь в профессиональной роли и не обещаете лишнего.','РСВ: «Информацию данную отмечу… отключение от маркетинговых коммуникаций происходит в течение 24 часов».'],
        ['«Тогда просто не берите трубку в следующий раз».',0,'Клиент получает ощущение пренебрежения.','«Я буду жаловаться!»','Такой ответ звучит обесценивающе и провоцирует жалобу.','Нельзя перекладывать ответственность на клиента.']
      ]},
      {q:'«И что теперь будет?»', meter:'low', opts:[
        ['«Гарантирую: больше никто никогда не позвонит».',0,'Обещание звучит красиво, но может быть недостоверным.','«Ну посмотрим».','Абсолютные гарантии — ошибка, если это не в ваших полномочиях.','Лучше объяснять процесс честно и спокойно.'],
        ['«Я отмечу обращение по регламенту. Обычно обработка такого запроса занимает до 24 часов. Спасибо, что сообщили».',3,'Разговор завершается спокойно и прозрачно.','«Хорошо, спасибо».','Вы даёте реалистичное ожидание и завершаете диалог корректно.','Это наиболее близко к РСВ: информируем о сроке и фиксируем запрос.'],
        ['«Не знаю, это не ко мне».',1,'Клиент ощущает беспомощность сотрудника.','«А к кому тогда?»','Даже если дальнейшая обработка не у вас, вы должны объяснить клиенту ближайший понятный шаг.','Не оставляйте клиента без логичного завершения.']
      ]}
    ]
  },
  {
    id:'fraud', route:'core', title:'Вы точно из банка?', level:'База', tag:'Безопасность',
    short:'Клиент сомневается, что разговаривает с сотрудником банка, и опасается мошенничества.',
    skill:'Снижение тревоги и безопасное продолжение диалога', regulation:'Мошенник',
    coach:'Ключ: поддержать бдительность клиента, предложить безопасное подтверждение и не спорить с опасением.',
    steps:[
      {q:'«Я не верю, что вы из банка. Сейчас полно мошенников!»', meter:'high', opts:[
        ['«Если не верите — это ваши проблемы, я вообще-то из банка».',0,'Клиент окончательно закрывается.','«До свидания».','Обесценивание страха клиента сразу убивает доверие.','Нужно не доказывать силой, а дать ощущение безопасности.'],
        ['«Понимаю ваши сомнения, это нормальная осторожность. Могу предложить способ убедиться, что вы общаетесь именно с сотрудником банка».',3,'Клиент готов слушать дальше, потому что его тревогу признали.','«И как я могу это проверить?»','Вы присоединились к тревоге клиента и дали ощущение контроля.','РСВ «Мошенник»: сначала признать бдительность клиента, затем предложить подтверждение.'],
        ['«Наш номер ведь высветился, этого достаточно».',1,'Тревога клиента снижается слабо.','«Номер можно подменить».','Формально ответ есть, но он не закрывает реальный страх клиента.','Нужен более содержательный способ подтверждения.']
      ]},
      {q:'Клиент спрашивает: «Как я могу проверить?»', meter:'mid', opts:[
        ['«Могу направить подтверждение общения с сотрудником банка. Также вы можете перезвонить на горячую линию и уточнить информацию».',3,'У клиента появляется безопасный маршрут продолжения разговора.','«Хорошо, это уже понятнее».','Вы даёте клиенту выбор безопасного подтверждения.','Это соответствует РСВ: СМС-подтверждение, звонок на горячую линию, соединение по внутреннему номеру.'],
        ['«Ну просто поверьте мне на слово».',0,'Тревога клиента не снимается.','«Нет, так не пойдёт».','При сомнениях клиента нельзя опираться только на доверие к словам оператора.','Нужны объективные способы подтверждения.'],
        ['«Давайте быстрее к предложению, там всё поймёте».',1,'Клиент чувствует давление.','«Я пока ничего обсуждать не буду».','Клиент ещё не готов к продуктовой части.','Сначала безопасность — потом продукт.']
      ]},
      {q:'Клиент говорит: «Мне привычнее обратиться в офис».', meter:'low', opts:[
        ['«Конечно, это ваш выбор. При этом по телефону можно быстрее узнать доступные предложения и условия, не выходя из дома. Если удобно, можем кратко обсудить сейчас».',3,'Клиент не чувствует давления и может продолжить разговор.','«Хорошо, кратко можно».','Вы не спорите с желанием клиента, а мягко показываете удобство дистанционного формата.','Опора на РСВ: признать привычность офиса, затем показать выгоду телефонного обслуживания.'],
        ['«В офис идти бессмысленно, там скажут то же самое».',0,'Клиент воспринимает ответ как давление.','«Тогда точно до свидания».','Нельзя обесценивать предпочтение клиента.','Нужно сравнивать форматы корректно.'],
        ['«Как хотите, идите».',1,'Контакт теряется без попытки сохранить диалог.','«Хорошо, всего доброго».','Слишком быстро сдаёте разговор.','Даже при выборе офиса можно коротко показать пользу текущего разговора.']
      ]}
    ]
  },
  {
    id:'pdn', route:'core', title:'Не хочу давать согласие на ПД', level:'Средний', tag:'Возражение',
    short:'Клиент опасается предоставлять согласие на обработку персональных данных.',
    skill:'Объяснение необходимости шага', regulation:'Обработка персональных данных',
    coach:'Ключ: показать, зачем нужно согласие, не спорить с осторожностью клиента и не уходить в формальности.',

];

let state = {screen:'home', selected:[], current:0, step:0, choice:null, points:0, total:0, history:[]};
const app = document.getElementById('app');
const ABV = ['А','Б','В'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

function render(){
  if(state.screen==='home') return renderHome();
  if(state.screen==='scenario') return renderScenario();
  if(state.screen==='between') return renderBetween();
  if(state.screen==='result') return renderResult();
}

function resetWith(selected){
  state = {screen:'scenario', selected, current:0, step:0, choice:null, points:0, total:0, history:[]};
  render();
  window.scrollTo(0,0);
}
function startRoute(id){
  const route = routes.find(r => r.id===id);
  resetWith(route.filter());
}
function startOne(i){ resetWith([i]); }

function currentScenario(){ return scenarios[state.selected[state.current]]; }
function currentStep(){ return currentScenario().steps[state.step]; }
function progressPercent(){
  const totalSteps = state.selected.length * 3;
  const done = state.current*3 + state.step + (state.choice!==null ? 1 : 0);
  return Math.round(done/totalSteps*100);
}
function meterValue(){
  const base = {high:26, mid:52, low:76}[currentStep().meter] || 40;
  if(state.choice===null) return base;
  return Math.min(100, Math.max(6, base + [-16, -2, 16, 16][currentStep().opts[state.choice][1]] || base));
}
function meterLabel(v){
  return v<35 ? 'Напряжение высокое' : v<65 ? 'Диалог неустойчив' : 'Контакт стабилизируется';
}

function renderScenario(){
  const sc = currentScenario();
  const st = currentStep();
  const chosen = state.choice!==null;
  const prev = state.step>0 ? state.history[state.history.length-1] : null;
  const meter = meterValue();
  const chosenOpt = chosen ? st.opts[state.choice] : null;
  app.innerHTML = `
    <article class="shell">
      <section class="panel">
        <div class="metaRow">
          <div>
            <div class="pill">Ситуация ${state.current+1} из ${state.selected.length}</div>

        </div>

          <div class="sessionBox"><div class="name">Баллы</div><strong>${state.points}</strong></div>

        </div>

          <div class="bubble">

          </div>
          <aside class="coach">

            <p class="muted">${esc(sc.coach)}</p>

        <div class="controls">

      </section>
    </article>`;

function choose(i){
  if(state.choice!==null) return;
  const st = currentStep();
  const opt = st.opts[i];
  state.choice = i;
  state.points += opt[1];
  state.total += 3;
  state.history.push({
    scenario: currentScenario().title,
    skill: currentScenario().skill,
    step: state.step+1,
    score: opt[1],
    answer: opt[0],
    explain: opt[4],
    reaction: opt[3],
    rsv: opt[5]
  });
  render();
}

function nextStep(){
  if(state.choice===null) return;
  state.choice = null;
  if(state.step < 2){ state.step++; state.screen='scenario'; }
  else if(state.current < state.selected.length-1){ state.screen='between'; }
  else { state.screen='result'; }
  render();
  window.scrollTo(0,0);
}

function renderBetween(){
  const sc = currentScenario();
  const last = state.history.slice(-3);
  const local = last.reduce((a,b)=>a+b.score,0);
  const title = local>=8 ? 'Сценарий отработан уверенно' : local>=5 ? 'Есть хорошая база, но нужна донастройка' : 'Нужна дополнительная тренировка';
  app.innerHTML = `

        <div class="eyebrow"><b></b> ситуация завершена</div>

          </div>
        </div>
        <div class="controls" style="margin-top:22px">
          <button class="btn light" onclick="goHome()">← На главную</button>
          <button class="btn primary" onclick="nextCase()">К следующей ситуации →</button>
        </div>
      </section>
    </article>`;
}
function nextCase(){ state.current++; state.step=0; state.choice=null; state.screen='scenario'; render(); window.scrollTo(0,0); }
function goHome(){ if(state.history.length && !confirm('Вернуться на главную? Текущий прогресс не сохранится.')) return; state.screen='home'; render(); }

function renderResult(){

  const strong = state.history.filter(x=>x.score===3);
  const risk = state.history.filter(x=>x.score<3);

  state.history.forEach(h=>{ if(!bySkill[h.skill]) bySkill[h.skill]={sum:0,max:0}; bySkill[h.skill].sum += h.score; bySkill[h.skill].max += 3; });

              <div class="card"><h3>Сильные стороны</h3><p class="muted">${strong.length ? 'Ты не везде уходил(а) в спор и выбирал(а) решения, которые сохраняют профессиональную позицию.' : 'Пока сильные решения встречались нечасто — это нормально для первого прохождения.'}</p></div>
              <div class="card"><h3>Зоны роста</h3><p class="muted">${risk.length ? 'Чаще всего ошибки возникают там, где хочется спорить, оправдываться, спешить или «дожать» клиента.' : 'Критичных провалов нет — теперь важно закрепить навык в повторном прохождении.'}</p></div>

          </div>
        </div>

        <h2 style="margin-top:28px">Рекомендации по навыкам</h2>
        <div class="recommend">
          ${weakSkills.map(w => `<div class="card"><span class="tagSkill">${esc(w.skill)}</span><h3 style="margin-top:10px">${w.p}%</h3><p class="muted">${w.p>=85 ? 'Навык отработан уверенно.' : w.p>=65 ? 'Есть база, но полезно пройти похожие кейсы ещё раз.' : 'Этому навыку стоит уделить отдельную тренировку и разбор с наставником.'}</p></div>`).join('')}
        </div>

        <h2 style="margin-top:28px">Разбор всех решений</h2>

          <button class="btn dark" onclick="window.print()">Распечатать итог</button>
          <button class="btn light" onclick="copyReport()">Скопировать результат</button>
          <button class="btn light" onclick="goHome()">Все сценарии</button>
        </div>
        <p class="note">Если результат нужен наставнику, можно распечатать страницу в PDF или скопировать текст. Сайт по-прежнему не отправляет результаты на сервер автоматически.</p>
      </section>
    </article>`;
}

function copyReport(){
  const report = [
    'Сложный звонок 2.0 — результат тренировки',
    `Баллы: ${state.points}/${state.total} (${pct(state.points,state.total)}%)`,
    '',
    ...state.history.map(h => `${h.scenario}, шаг ${h.step} — ${h.score}/3\nОтвет: ${h.answer}\nКомментарий: ${h.explain}\nОпора на РСВ: ${h.rsv}`)
  ].join('\n\n');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(report).then(()=>alert('Результат скопирован')).catch(()=>prompt('Скопируйте текст:', report));
  } else {
    prompt('Скопируйте текст:', report);
  }
}

render();
</script>
</body>
</html>
